<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: transparent;
      color: white;
      height: 100%;
    }
    .container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background-color: #2e3137;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .content {
      padding: 32px;
    }
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }
    h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    input, .dropdown {
      width: 100%;
      padding: 12px 16px;
      background-color: #3a3d4a;
      border: none;
      border-radius: 24px;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    input::placeholder {
      color: #8a8d9a;
    }
    .dropdown {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #8a8d9a;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #fff27a;
      color: black;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #4a4d5a;
    }
    .divider span {
      padding: 0 16px;
      color: #8a8d9a;
    }
    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background-color: #3a3d4a;
      border: none;
      border-radius: 24px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .social-btn img {
      margin-right: 8px;
      width: 20px;
      height: 20px;
    }
    .member-text {
      text-align: center;
      color: #8a8d9a;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .signin-btn {
      width: 100%;
      padding: 12px;
      background-color: #fff27a;
      color: black;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="logo">
        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Frame%203491%20%281%29%2013-abVgGwfyDhrdu9TeQuBQhPA6OCXAKz.png" alt="Logo">
      </div>
      
      <h2>Peer-2-Peer Wealth Creation!</h2>
      
      <form>
        <div class="form-group">
          <input type="email" placeholder="Referrer's Email Address">
        </div>
        
        <div class="form-group">
          <div class="dropdown">
            <span>Select Country</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        
        <div class="form-group">
          <input type="email" placeholder="Your email address" required>
        </div>
        
        <div class="form-group">
          <input type="password" placeholder="Password" required>
        </div>
        
        <div class="form-group">
          <input type="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn">Register</button>
      </form>
      
      <div class="divider">
        <span>OR</span>
      </div>
      
      <div class="social-buttons">
        <button class="social-btn">
          <img src="/apple-icon.png" alt="Apple">
          Sign up with Apple
        </button>
        <button class="social-btn">
          <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/peerWealth_Cursor-KoDb8jTt0Pno5DVZm0QrqMEUrj6SJa.png" alt="Google">
          Sign up with Google
        </button>
      </div>
      
      <p class="member-text">Already a Member - Sign in?</p>
    </div>
    
    <button class="signin-btn" onclick="window.location.href='/login'">Sign In</button>
  </div>
</body>
</html>
